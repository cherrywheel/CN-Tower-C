on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSVC (Windows)
      uses: ilammy/msvc-dev-cmd@v1

    - name: List directory contents (Windows)
      run: dir src

    - name: Check if build file exists
      id: check_build
      run: |
        if exist src\cn_tower_game.exe (
          echo "Build succeeded" >> $GITHUB_ENV
        ) else (
          echo "Build failed" >> $GITHUB_ENV
        )

    - name: Upload Artifact (Windows)
      if: env.BUILD_SUCCEEDED == 'Build succeeded'
      uses: actions/upload-artifact@v3
      with:
        name: cn_tower_game-windows
        path: src\cn_tower_game.exe
