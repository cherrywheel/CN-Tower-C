on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcvars: x64
            test: true
          - arch: x86
            vcvars: x64_x86
            test: true
          - arch: arm64 # cross compiled and cant run on x64
            vcvars: x64_arm64
            test: false

    steps:
    - uses: actions/checkout@v6

    # set up msvc by hand since ilammy/msvc-dev-cmd only runs on node 20
    - name: build with nmake
      shell: cmd
      run: |
        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
        if not defined VS_PATH exit /b 1
        call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }} || exit /b 1
        cd src
        nmake

    - name: play through to the win
      if: matrix.test
      shell: cmd
      run: |
        cd src
        set CN_TOWER_SEED=1
        cn_tower_game.exe < ..\tests\win_path.txt > ..\win_output.txt
        findstr /C:"(Win)" ..\win_output.txt || (type ..\win_output.txt & exit /b 1)

    - name: upload exe
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-windows-${{ matrix.arch }}
        path: src\cn_tower_game.exe

  # static binaries cross compiled and tested under qemu
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,      cc: gcc,                             pkgs: "",                                                         qemu: "" }
          - { arch: i686,        cc: i686-linux-gnu-gcc,              pkgs: "gcc-i686-linux-gnu libc6-dev-i386-cross",                  qemu: qemu-i386 }
          - { arch: aarch64,     cc: aarch64-linux-gnu-gcc,           pkgs: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross",              qemu: qemu-aarch64 }
          - { arch: armhf,       cc: arm-linux-gnueabihf-gcc,         pkgs: "gcc-arm-linux-gnueabihf libc6-dev-armhf-cross",            qemu: qemu-arm }
          - { arch: armel,       cc: arm-linux-gnueabi-gcc,           pkgs: "gcc-arm-linux-gnueabi libc6-dev-armel-cross",              qemu: qemu-arm }
          - { arch: riscv64,     cc: riscv64-linux-gnu-gcc,           pkgs: "gcc-riscv64-linux-gnu libc6-dev-riscv64-cross",            qemu: qemu-riscv64 }
          - { arch: loongarch64, cc: "python3 -m ziglang cc -target loongarch64-linux-musl", pkgs: "",                                  qemu: qemu-loongarch64, zig: true }
          - { arch: mipsel,      cc: mipsel-linux-gnu-gcc,            pkgs: "gcc-mipsel-linux-gnu libc6-dev-mipsel-cross",              qemu: qemu-mipsel }
          - { arch: mips,        cc: mips-linux-gnu-gcc,              pkgs: "gcc-mips-linux-gnu libc6-dev-mips-cross",                  qemu: qemu-mips }
          - { arch: mips64el,    cc: mips64el-linux-gnuabi64-gcc,     pkgs: "gcc-mips64el-linux-gnuabi64 libc6-dev-mips64el-cross",     qemu: qemu-mips64el }
          - { arch: mips64,      cc: mips64-linux-gnuabi64-gcc,       pkgs: "gcc-mips64-linux-gnuabi64 libc6-dev-mips64-cross",         qemu: qemu-mips64 }
          - { arch: ppc64le,     cc: powerpc64le-linux-gnu-gcc,       pkgs: "gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross",        qemu: qemu-ppc64le }
          - { arch: ppc64,       cc: powerpc64-linux-gnu-gcc,         pkgs: "gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross",            qemu: qemu-ppc64 }
          - { arch: powerpc,     cc: powerpc-linux-gnu-gcc,           pkgs: "gcc-powerpc-linux-gnu libc6-dev-powerpc-cross",            qemu: qemu-ppc }
          - { arch: s390x,       cc: s390x-linux-gnu-gcc,             pkgs: "gcc-s390x-linux-gnu libc6-dev-s390x-cross",                qemu: qemu-s390x }
          - { arch: sparc64,     cc: sparc64-linux-gnu-gcc,           pkgs: "gcc-sparc64-linux-gnu libc6-dev-sparc64-cross",            qemu: qemu-sparc64 }
          - { arch: alpha,       cc: alpha-linux-gnu-gcc,             pkgs: "gcc-alpha-linux-gnu libc6-dev-alpha-cross",                qemu: qemu-alpha }
          - { arch: hppa,        cc: hppa-linux-gnu-gcc,              pkgs: "gcc-hppa-linux-gnu libc6-dev-hppa-cross",                  qemu: qemu-hppa }
          - { arch: m68k,        cc: m68k-linux-gnu-gcc,              pkgs: "gcc-m68k-linux-gnu libc6-dev-m68k-cross",                  qemu: qemu-m68k }
          - { arch: sh4,         cc: sh4-linux-gnu-gcc,               pkgs: "gcc-sh4-linux-gnu libc6-dev-sh4-cross",                    qemu: qemu-sh4 }

    steps:
    - uses: actions/checkout@v6

    - name: install toolchain
      if: matrix.qemu != ''
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends ${{ matrix.pkgs }} qemu-user

    # zig from pypi since setup-zig still runs on node 20
    - name: install zig
      if: matrix.zig
      run: pip install ziglang

    - name: build with make
      run: make -C src CC="${{ matrix.cc }}" CFLAGS="-std=c99 -Wall -Wextra -pedantic -Werror -O2" LDFLAGS="-static"

    - name: play through to the win
      run: |
        cd src
        file cn_tower_game
        CN_TOWER_SEED=1 ${{ matrix.qemu }} ./cn_tower_game < ../tests/win_path.txt > ../win_output.txt
        grep -F "(Win)" ../win_output.txt || { cat ../win_output.txt; exit 1; }

    - name: upload binary
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-linux-${{ matrix.arch }}
        path: src/cn_tower_game

  # universal binary with apple silicon and intel in one file
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: build with make
      run: |
        ARCH_FLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
        make -C src CC=clang CFLAGS="-std=c99 -Wall -Wextra -pedantic -Werror -O2 $ARCH_FLAGS" LDFLAGS="$ARCH_FLAGS"
        lipo -info src/cn_tower_game

    - name: play through to the win
      run: |
        cd src
        CN_TOWER_SEED=1 ./cn_tower_game < ../tests/win_path.txt > ../win_output.txt
        grep -F "(Win)" ../win_output.txt || { cat ../win_output.txt; exit 1; }

    - name: upload binary
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-macos-universal
        path: src/cn_tower_game

  # webassembly for wasmtime wasmer and friends
  build-wasm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: install zig and wasmtime
      run: |
        pip install ziglang
        curl -sSf https://wasmtime.dev/install.sh | bash
        echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

    - name: build with make
      run: make -C src CC="python3 -m ziglang cc -target wasm32-wasi" CFLAGS="-std=c99 -Wall -Wextra -pedantic -Werror -O2"

    - name: play through to the win
      run: |
        cd src
        wasmtime run --env CN_TOWER_SEED=1 cn_tower_game < ../tests/win_path.txt > ../win_output.txt
        grep -F "(Win)" ../win_output.txt || { cat ../win_output.txt; exit 1; }

    - name: upload module
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-wasm32-wasi
        path: src/cn_tower_game

  # native builds inside vms and each one plays through to the win
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build and play in freebsd
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        run: sh tests/ci_build.sh
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-freebsd-x86_64
        path: src/cn_tower_game

  build-openbsd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build and play in openbsd
      uses: vmactions/openbsd-vm@v1
      with:
        usesh: true
        run: sh tests/ci_build.sh
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-openbsd-x86_64
        path: src/cn_tower_game

  build-netbsd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build and play in netbsd
      uses: vmactions/netbsd-vm@v1
      with:
        usesh: true
        run: sh tests/ci_build.sh
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-netbsd-x86_64
        path: src/cn_tower_game

  build-dragonflybsd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build and play in dragonfly bsd
      uses: vmactions/dragonflybsd-vm@v1
      with:
        usesh: true
        run: sh tests/ci_build.sh
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-dragonflybsd-x86_64
        path: src/cn_tower_game

  build-solaris:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build and play in solaris
      uses: vmactions/solaris-vm@v1
      with:
        usesh: true
        prepare: pkg install -q developer/gcc || true
        run: sh tests/ci_build.sh
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-solaris-x86_64
        path: src/cn_tower_game

  build-illumos:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build and play in omnios
      uses: vmactions/omnios-vm@v1
      with:
        usesh: true
        prepare: pkg install -q build-essential || true
        run: sh tests/ci_build.sh
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-illumos-x86_64
        path: src/cn_tower_game

  build-haiku:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build and play in haiku
      uses: vmactions/haiku-vm@v1
      with:
        usesh: true
        run: sh tests/ci_build.sh
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-haiku-x86_64
        path: src/cn_tower_game

  # release on every push to main
  # windows linux and macos must pass while the vm builds ship if they made it
  release:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
    needs: [ build-windows, build-linux, build-macos, build-wasm, build-freebsd, build-openbsd, build-netbsd, build-dragonflybsd, build-solaris, build-illumos, build-haiku ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: download builds
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: collect release files
      run: |
        mkdir release
        for dir in artifacts/*; do
          name=$(basename "$dir")
          case "$name" in
            *windows*) cp "$dir/cn_tower_game.exe" "release/$name.exe" ;;
            *wasi*)    cp "$dir/cn_tower_game" "release/$name.wasm" ;;
            *)         cp "$dir/cn_tower_game" "release/$name" ;;
          esac
        done
        ls -la release

    - name: create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: v1.0.${{ github.run_number }}
      run: |
        gh release create "$TAG" release/* \
          --target "$GITHUB_SHA" \
          --title "CN Tower $TAG" \
          --generate-notes
