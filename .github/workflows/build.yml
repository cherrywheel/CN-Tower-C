on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSVC (Windows)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build with Make
      run: |
        # Проверка, что компилятор MSVC доступен
        cl /? || exit 1
        make -C src

    - name: List directory contents (Windows)
      run: dir src

    - name: Upload Artifact (Windows)
      run: |
        if exist src\cn_tower_game.exe (
          echo "Uploading Windows artifact..."
          uses: actions/upload-artifact@v3
          with:
            name: cn_tower_game-windows
            path: src\cn_tower_game.exe
        ) else (
          echo "Windows build failed, skipping upload."
        )
