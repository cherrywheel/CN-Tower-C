on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "assets/**", "LICENSE" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "assets/**", "LICENSE" ]
  workflow_dispatch:

# a new push cancels the old run on the same branch except on main so releases finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcvars: x64
            test: true
          - arch: x86
            vcvars: x64_x86
            test: true
          - arch: arm64 # cross compiled and cant run on x64
            vcvars: x64_arm64
            test: false

    steps:
    - uses: actions/checkout@v6

    # call so the step comes back after setup.cmd and then wipe its build
    # so the real build below starts clean
    - name: setup.cmd with gcc
      if: matrix.arch == 'x64'
      shell: cmd
      run: |
        call setup.cmd --yes --gcc || exit /b 1
        del /q src\*.obj src\*.res src\cn_tower_game.exe 2>nul
        exit /b 0

    - name: setup.cmd with msvc
      if: matrix.arch == 'x64'
      shell: cmd
      run: |
        call setup.cmd --yes || exit /b 1
        del /q src\*.obj src\*.res src\cn_tower_game.exe 2>nul
        exit /b 0

    # set up msvc by hand since ilammy/msvc-dev-cmd only runs on node 20
    - name: build with nmake
      shell: cmd
      run: |
        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
        if not defined VS_PATH exit /b 1
        call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }} || exit /b 1
        cd src
        nmake

    - name: play through to the win
      if: matrix.test
      shell: cmd
      run: |
        cd src
        set CN_TOWER_SEED=1
        cn_tower_game.exe < ..\tests\win_path.txt > ..\win_output.txt
        findstr /C:"(Win)" ..\win_output.txt || (type ..\win_output.txt & exit /b 1)

    - name: upload exe
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-windows-${{ matrix.arch }}
        path: src\cn_tower_game.exe

  # every linux arch in one job through setup.sh --cross
  # static binaries cross compiled and tested under qemu
  build-linux:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v6

    # zig from pypi for loongarch64 since setup-zig still runs on node 20
    - name: install zig
      run: pip install ziglang

    - name: build and play every linux arch
      env:
        CFLAGS: -std=c99 -Wall -Wextra -pedantic -Werror -O2
      run: sh setup.sh --yes --cross --out linux-builds

    - name: upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-linux-all
        path: linux-builds/

  # universal binary with apple silicon and intel in one file
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: setup.sh
      run: |
        sh setup.sh --yes
        make -C src clean

    - name: build with make
      run: |
        ARCH_FLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
        make -C src CC=clang CFLAGS="-std=c99 -Wall -Wextra -pedantic -Werror -O2 $ARCH_FLAGS" LDFLAGS="$ARCH_FLAGS"
        lipo -info src/cn_tower_game

    - name: play through to the win
      run: |
        cd src
        CN_TOWER_SEED=1 ./cn_tower_game < ../tests/win_path.txt > ../win_output.txt
        grep -F "(Win)" ../win_output.txt || { cat ../win_output.txt; exit 1; }

    - name: upload binary
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-macos-universal
        path: src/cn_tower_game

  # webassembly for wasmtime wasmer and friends
  build-wasm:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v6

    - name: install zig and wasmtime
      run: |
        pip install ziglang
        curl -sSf https://wasmtime.dev/install.sh | bash
        echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

    - name: build with make
      run: make -C src CC="python3 -m ziglang cc -target wasm32-wasi" CFLAGS="-std=c99 -Wall -Wextra -pedantic -Werror -O2"

    - name: play through to the win
      run: |
        cd src
        wasmtime run --env CN_TOWER_SEED=1 cn_tower_game < ../tests/win_path.txt > ../win_output.txt
        grep -F "(Win)" ../win_output.txt || { cat ../win_output.txt; exit 1; }

    - name: upload module
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-wasm32-wasi
        path: src/cn_tower_game

  # native builds inside vms through setup.sh and each one plays through to the win
  build-freebsd:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
    - name: build and play in freebsd
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        run: sh setup.sh --yes
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-freebsd-x86_64
        path: src/cn_tower_game

  build-openbsd:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
    - name: build and play in openbsd
      uses: vmactions/openbsd-vm@v1
      with:
        usesh: true
        run: sh setup.sh --yes
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-openbsd-x86_64
        path: src/cn_tower_game

  build-netbsd:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
    - name: build and play in netbsd
      uses: vmactions/netbsd-vm@v1
      with:
        usesh: true
        run: sh setup.sh --yes
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-netbsd-x86_64
        path: src/cn_tower_game

  build-dragonflybsd:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
    - name: build and play in dragonfly bsd
      uses: vmactions/dragonflybsd-vm@v1
      with:
        usesh: true
        run: sh setup.sh --yes
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-dragonflybsd-x86_64
        path: src/cn_tower_game

  build-solaris:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
    - name: build and play in solaris
      uses: vmactions/solaris-vm@v1
      with:
        usesh: true
        prepare: pkg install -q developer/gcc || true
        run: sh setup.sh --yes
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-solaris-x86_64
        path: src/cn_tower_game

  build-illumos:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
    - name: build and play in omnios
      uses: vmactions/omnios-vm@v1
      with:
        usesh: true
        prepare: pkg install -q build-essential || true
        run: sh setup.sh --yes
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-illumos-x86_64
        path: src/cn_tower_game

  build-haiku:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v6
    - name: build and play in haiku
      uses: vmactions/haiku-vm@v1
      with:
        usesh: true
        run: sh setup.sh --yes
    - uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-haiku-x86_64
        path: src/cn_tower_game

  # elbrus e2k with mcst lcc from the varyashine/e2k-toolchain release
  # TOOLCHAIN_TOKEN is only needed while that repo is private
  build-elbrus:
    runs-on: ubuntu-26.04
    env:
      TOOLCHAIN_REPO: varyashine/e2k-toolchain
      TOOLCHAIN_TAG: lcc-1.31.05
      TOOLCHAIN_FILE: elbrus_cross_compiler_toolchain.zip
      TOOLCHAIN_SHA256: ef0688b494bf6731e1dc8d70fa4d795e7270fb1ec2c6ad696453e677d309e884
    steps:
    - uses: actions/checkout@v6

    - name: download toolchain
      env:
        GH_TOKEN: ${{ secrets.TOOLCHAIN_TOKEN || github.token }}
      run: |
        mkdir -p "$RUNNER_TEMP/e2k"
        gh release download "$TOOLCHAIN_TAG" -R "$TOOLCHAIN_REPO" -p "$TOOLCHAIN_FILE" -D "$RUNNER_TEMP/e2k"
        echo "$TOOLCHAIN_SHA256  $RUNNER_TEMP/e2k/$TOOLCHAIN_FILE" | sha256sum -c

    - name: unpack and verify
      run: |
        cd "$RUNNER_TEMP/e2k"
        unzip -q "$TOOLCHAIN_FILE"
        rm "$TOOLCHAIN_FILE"
        cd elbrus-toolchain
        sha512sum -c SHA512SUMS
        # lcc looks for its parts under this exact path so setup.sh just symlinks it there
        sudo sh "$PWD/setup.sh"
        echo "E2K=$RUNNER_TEMP/e2k/elbrus-toolchain" >> "$GITHUB_ENV"
        echo "LCC_HOME=/opt/mcst/lcc-1.31.05.e2k-v6.2c3.linux-6.1" >> "$GITHUB_ENV"

    - name: build with lcc
      run: |
        "$LCC_HOME/bin/lcc" --version
        make -C src CC="$LCC_HOME/bin/lcc" CFLAGS="-std=c99 -Wall -Wextra -O2" LDFLAGS="-static"
        file src/cn_tower_game

    - name: play through to the win under qemu-e2k
      run: |
        cd src
        CN_TOWER_SEED=1 "$E2K/emulator/qemu-e2k" -L "$LCC_HOME/fs" ./cn_tower_game < ../tests/win_path.txt > ../win_output.txt
        grep -F "(Win)" ../win_output.txt || { cat ../win_output.txt; exit 1; }

    - name: upload binary
      uses: actions/upload-artifact@v7
      with:
        name: cn_tower_game-linux-e2k
        path: src/cn_tower_game

  # openwrt packages built with the official sdk
  # ipk for 24.10 and apk for 25.12 and where theres an openwrt rootfs image
  # the package gets installed with opkg or apk and played through to the win
  build-openwrt:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, mips_24kc, mipsel_24kc, aarch64_cortex-a53, aarch64_generic, arm_cortex-a7_neon-vfpv4, arm_cortex-a9_vfpv3-d16 ]
        openwrt:
          - { version: 24.10.8, series: "24.10", ext: ipk }
          - { version: 25.12.5, series: "25.12", ext: apk }
        # the rootfs images tag their platform with openwrt arch names except x86_64
        include:
          - { arch: x86_64,                  test: true, platform: linux/amd64 }
          - { arch: mips_24kc,               test: true, platform: linux/mips_24kc }
          - { arch: aarch64_generic,         test: true, platform: linux/aarch64_generic }
          - { arch: arm_cortex-a9_vfpv3-d16, test: true, platform: linux/arm_cortex-a9_vfpv3-d16 }

    steps:
    - uses: actions/checkout@v6

    - name: copy the game sources into the package
      run: cp -r src include openwrt/cn-tower/

    # the sdk archive is a few hundred mb from downloads.openwrt.org so keep it
    # between runs and only fetch the small signed checksum list every time
    - name: cache the openwrt sdk
      uses: actions/cache@v5
      with:
        path: ~/openwrt-sdk-cache
        key: openwrt-sdk-${{ matrix.arch }}-${{ matrix.openwrt.version }}

    - name: build with the openwrt sdk
      run: |
        mkdir -p ~/openwrt-sdk-cache openwrt-out
        # the sdk runs as its own user so let it write everywhere it needs to
        chmod -R a+rwX ~/openwrt-sdk-cache openwrt openwrt-out
        docker run --rm \
          -v "$HOME/openwrt-sdk-cache:/cache" \
          -v "$PWD/openwrt:/feed" \
          -v "$PWD/openwrt-out:/artifacts" \
          -v "$PWD/.github/openwrt-sdk-build.sh:/openwrt-sdk-build.sh:ro" \
          --entrypoint /bin/bash \
          "ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.openwrt.version }}" \
          /openwrt-sdk-build.sh
        sudo chown -R "$(id -u):$(id -g)" ~/openwrt-sdk-cache openwrt openwrt-out

    - name: find the package
      run: |
        pkg=$(find openwrt-out/bin/packages -name "cn-tower*.${{ matrix.openwrt.ext }}" | head -n 1)
        if [ -z "$pkg" ]; then
          find openwrt-out -type f
          exit 1
        fi
        mkdir -p openwrt-test
        cp "$pkg" "openwrt-test/cn-tower.${{ matrix.openwrt.ext }}"
        cp tests/win_path.txt openwrt-test/
        ls -la openwrt-test

    # ubuntus qemu-user-static registers every arch including 32 bit mips
    # which docker/setup-qemu-action doesnt have
    - name: set up qemu for the openwrt rootfs
      if: matrix.test
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends qemu-user-static

    - name: install and play through to the win in openwrt
      if: matrix.test
      run: |
        docker run --rm --platform "${{ matrix.platform }}" -v "$PWD/openwrt-test:/test" "openwrt/rootfs:${{ matrix.arch }}-${{ matrix.openwrt.version }}" /bin/sh -c '
          set -e
          if [ -f /test/cn-tower.apk ]; then
            apk add --allow-untrusted /test/cn-tower.apk
          else
            mkdir -p /var/lock
            opkg install /test/cn-tower.ipk
          fi
          cd /tmp
          CN_TOWER_SEED=1 cn-tower < /test/win_path.txt > /test/win_output.txt
        '
        grep -F "(Win)" openwrt-test/win_output.txt || { cat openwrt-test/win_output.txt; exit 1; }

    - name: upload package
      uses: actions/upload-artifact@v7
      with:
        name: cn-tower-openwrt-${{ matrix.openwrt.series }}-${{ matrix.arch }}
        path: openwrt-test/cn-tower.${{ matrix.openwrt.ext }}

  # release on every push to main
  # windows linux and macos must pass while the vm elbrus and openwrt builds ship if they made it
  release:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
    needs: [ build-windows, build-linux, build-macos, build-elbrus, build-openwrt, build-wasm, build-freebsd, build-openbsd, build-netbsd, build-dragonflybsd, build-solaris, build-illumos, build-haiku ]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: download builds
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: collect release files
      run: |
        mkdir release
        for dir in artifacts/*; do
          name=$(basename "$dir")
          case "$name" in
            *linux-all*) cp "$dir"/cn_tower_game-linux-* release/ ;;
            *windows*) cp "$dir/cn_tower_game.exe" "release/$name.exe" ;;
            *wasi*)    cp "$dir/cn_tower_game" "release/$name.wasm" ;;
            *openwrt*) for f in "$dir"/cn-tower.*; do cp "$f" "release/$name.${f##*.}"; done ;;
            *)         cp "$dir/cn_tower_game" "release/$name" ;;
          esac
        done
        ls -la release

    - name: create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: v1.0.${{ github.run_number }}
      run: |
        gh release create "$TAG" release/* \
          --target "$GITHUB_SHA" \
          --title "CN Tower $TAG" \
          --generate-notes
