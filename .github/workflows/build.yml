 ```yaml
 name: C Build

 on:
   push:
     branches: [ "main" ]  # Trigger on pushes to the 'main' branch
   pull_request:
     branches: [ "main" ]  # Trigger on pull requests to the 'main' branch

 jobs:
   build:
     runs-on: windows-latest  # Build on a Windows virtual machine

     steps:
     - uses: actions/checkout@v3  # Checkout your repository code

     - name: Setup MSVC  # Use MSVC for compilation (more reliable on Windows)
       uses: ilammy/msvc-dev-cmd@v1

     - name: Build with Make
       run: make -C src  # Run 'make' in the 'src' directory

     - name: Upload Artifact (Optional)
       uses: actions/upload-artifact@v3
       with:
         name: cn_tower_game
         path: src/cn_tower_game.exe
 ```
